name: Gerar instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Compilar e gerar instalador
        run: npm run build:desktop

      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Conexoes-Biblicas-LOGOS-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
